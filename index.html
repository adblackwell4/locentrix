<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Locentrix — Coming Soon</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: 'Segoe UI', sans-serif;
        color: white;
        background: #000814;
    }

    /* Center text container */
    .center-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 10;
    }

    .center-text h1 {
        font-size: 4rem;
        letter-spacing: 0.15rem;
        text-transform: uppercase;
        background: linear-gradient(90deg, #00aaff, #66e0ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: glow 3s ease-in-out infinite;
    }

    .center-text h2 {
        font-size: 1.5rem;
        opacity: 0.85;
        margin-top: -10px;
    }

    .center-text p {
        font-size: 1.2rem;
        opacity: 0.7;
        margin-top: 15px;
        letter-spacing: 0.1rem;
    }

    @keyframes glow {
        0% { text-shadow: 0 0 10px #00aaff; }
        50% { text-shadow: 0 0 25px #66e0ff; }
        100% { text-shadow: 0 0 10px #00aaff; }
    }
</style>
</head>

<body>

<div class="center-text">
    <h1>LOCENTRIX</h1>
    <h2>Geospatial Solutions</h2>
    <p>Coming Soon</p>
</div>

<!-- Three.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // Scene setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({alpha: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Globe geometry
    const geometry = new THREE.SphereGeometry(3, 64, 64);

    // Globe texture (high‑res Earth)
    const textureLoader = new THREE.TextureLoader();
    const earthTexture = textureLoader.load("https://raw.githubusercontent.com/creativetimofficial/public-assets/master/earth.jpg");

    const material = new THREE.MeshBasicMaterial({ map: earthTexture });
    const globe = new THREE.Mesh(geometry, material);
    scene.add(globe);

    camera.position.z = 7;

    // Animation loop
    function animate() {
        requestAnimationFrame(animate);
        globe.rotation.y += 0.002; // slow rotation
        renderer.render(scene, camera);
    }
    animate();

    // Responsive resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
