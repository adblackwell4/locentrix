<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Locentrix — Coming Soon</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Techy Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        background: black;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        opacity: 0;
        animation: fadeIn 2s ease forwards;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .container {
        margin-top: 10%;
    }

    img {
        width: 250px;
        margin-bottom: 30px;
    }

    h1 {
        font-family: 'Orbitron', sans-serif; /* tech font */
        font-size: 3rem;
        letter-spacing: 0.15rem;
    }

    h2 {
        font-size: 1.5rem;
        opacity: 0.85;
        margin-top: -10px;
    }

    p {
        font-size: 1.2rem;
        opacity: 0.7;
        margin-top: 20px;
    }
</style>
</head>

<body>

<div class="container">
    <img src="assets/earth.png" alt="Earth">
    <h1>LOCENTRIX</h1>
    <h2>Geospatial Solutions</h2>
    <p>Coming Soon</p>
</div>

</body>
</html>
